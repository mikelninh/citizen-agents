name: Gauntlet Contract

on:
  pull_request:
  push:
    branches: [feat/gauntlet-adapter]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gauntlet programme
        run: |
          python - <<'PY'
          import json
          p=json.load(open('gauntlet/program.json'))
          required={'version','system','objective','fitness','mutable','forbidden','starter_cases','acceptance','evaluation_mode'}
          missing=required-set(p)
          assert not missing, f'missing keys: {sorted(missing)}'
          assert p['fitness'].get('primary') and p['fitness'].get('hard_gates')
          assert len(p['starter_cases']) >= 3
          assert p['mutable'] and p['forbidden']
          assert not set(p['mutable']) & set(p['forbidden'])
          assert any('future' in x.lower() for x in p['fitness']['hard_gates']), 'historical replay needs future-leak gate'
          print('Gauntlet contract OK:', p['system'])
          PY
      - name: Compile historical replay harness
        run: python -m py_compile gauntlet/run_replay_harness.py
      - name: Enforce replay mechanics
        run: python gauntlet/run_replay_harness.py
