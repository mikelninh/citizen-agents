<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f96bee"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c86b"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background glow -->
  <circle cx="100" cy="100" r="95" fill="url(#glow)"/>

  <!-- providence triangles (faint) -->
  <polygon points="100,48 132,132 68,132" fill="none" stroke="#8b5cf6" stroke-opacity="0.22" stroke-width="1"/>
  <polygon points="100,152 132,68 68,68" fill="none" stroke="#8b5cf6" stroke-opacity="0.16" stroke-width="1"/>

  <!-- outer diamond -->
  <rect x="24" y="24" width="152" height="152" rx="2" fill="none" stroke="url(#gold)" stroke-width="1.4" transform="rotate(45 100 100)"/>

  <!-- outer circle -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold)" stroke-width="1.1" stroke-opacity="0.85"/>

  <!-- geometric ring (seed of life hint) -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#vg)" stroke-width="0.9" stroke-opacity="0.5" stroke-dasharray="3 5"/>

  <!-- eye almond -->
  <path d="M32 100 C 56 62 144 62 168 100 C 144 138 56 138 32 100 Z"
        fill="rgba(139,92,246,0.06)" stroke="url(#vg)" stroke-width="1.8"/>

  <!-- iris ring -->
  <circle cx="100" cy="100" r="27" fill="none" stroke="url(#vg)" stroke-width="1.6"/>
  <circle cx="100" cy="100" r="27" fill="rgba(139,92,246,0.12)"/>

  <!-- pupil + check (the verification mark) -->
  <circle cx="100" cy="100" r="15" fill="url(#vg)"/>
  <path d="M92.5 100 L98.2 105.8 L108.5 94.5" fill="none" stroke="#0c0c12" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104" cy="95" r="2.4" fill="#fff" opacity="0.85"/>

  <!-- crown lashes (geometric) -->
  <g stroke="url(#vg)" stroke-width="1.3" stroke-linecap="round">
    <line x1="52" y1="74" x2="46" y2="60"/>
    <line x1="72" y1="62" x2="68" y2="46"/>
    <line x1="94" y1="57" x2="92" y2="40"/>
    <line x1="116" y1="59" x2="120" y2="43"/>
    <line x1="136" y1="66" x2="143" y2="52"/>
    <line x1="152" y1="82" x2="160" y2="72"/>
  </g>
  <g stroke="url(#gold)" stroke-width="1.1" stroke-linecap="round">
    <line x1="48" y1="126" x2="40" y2="138"/>
    <line x1="70" y1="138" x2="64" y2="152"/>
    <line x1="130" y1="138" x2="136" y2="152"/>
    <line x1="152" y1="126" x2="160" y2="138"/>
  </g>
</svg>
